<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Steve | Full-Stack & Mobile Developer</title>
  <meta name="description"
    content="Portfolio of Steve, Full-Stack Developer and Mobile Engineer specializing in Laravel, React, Flutter, and scalable web architectures." />
  <meta name="theme-color" content="#05070e" />
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('steve-theme') || 'dark';
        if (theme === 'light') {
          document.documentElement.classList.add('light');
          document.documentElement.classList.remove('dark');
        } else {
          document.documentElement.classList.add('dark');
          document.documentElement.classList.remove('light');
        }
      } catch (e) {}
    })();
  </script>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Steve | Full-Stack & Mobile Developer" />
  <meta property="og:description" content="Portfolio of Steve, Full-Stack Developer and Mobile Engineer specializing in Laravel, React, Flutter, and scalable web architectures." />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Steve | Full-Stack & Mobile Developer" />
  <meta name="twitter:description" content="Building scalable web systems, clean REST APIs, and fluid cross-platform mobile apps with Laravel, React, and Flutter." />

  <!-- DNS Prefetch & Preconnect for External Assets -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://img.icons8.com" crossorigin />
  <link rel="dns-prefetch" href="https://img.icons8.com" />

  <!-- Preload Critical Above-The-Fold Hero Tech Icons -->
  <link rel="preload" as="image" href="https://img.icons8.com/color/48/react-native.png" />
  <link rel="preload" as="image" href="https://img.icons8.com/color/48/flutter.png" />
  <link rel="preload" as="image" href="https://img.icons8.com/fluency/48/laravel.png" />
  <link rel="preload" as="image" href="https://img.icons8.com/color/48/nodejs.png" />
  <link rel="preload" as="image" href="https://img.icons8.com/color/48/postgreesql.png" />

  <!-- Asynchronous Non-Blocking Google Fonts Loading -->
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
  <link
    href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet"
    media="print"
    onload="this.media='all'" />
  <noscript>
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
      rel="stylesheet" />
  </noscript>
</head>

<body class="bg-[#05070e] text-slate-200">

</body>

</html>
