<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#0b2c3d" />
      <stop offset="100%" stop-color="#040c17" />
    </radialGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="60%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#22d3ee" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Navbar Logo Rounded Badge -->
  <rect
    x="1"
    y="1"
    width="30"
    height="30"
    rx="7.5"
    fill="url(#bgGrad)"
    stroke="#22d3ee"
    stroke-width="1.2"
    stroke-opacity="0.45"
  />

  <!-- Inner Terminal Icon Matching Navbar -->
  <g filter="url(#glow)">
    <polyline
      points="8.5 9.5, 15 16, 8.5 22.5"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="2.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <line
      x1="18"
      y1="22.5"
      x2="23.5"
      y2="22.5"
      fill="none"
      stroke="url(#cyanGrad)"
      stroke-width="2.5"
      stroke-linecap="round"
    />
  </g>
</svg>